server:
  shutdown: graceful

spring:
  application:
    name: aiems-be

  profiles:
    default: local

  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    locations:
      - classpath:db/migration/{vendor}
      - classpath:db/seed
    baseline-on-migrate: true

  data:
    redis:
      repositories:
        enabled: false

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ai_server
    publisher-confirm-type: correlated
    publisher-returns: true

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-expiration: 1h
  refresh-expiration: 14d

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

app:
  role:
    batch:
      enabled: ${ROLE_BATCH_ENABLED}
    consumer:
      enabled: ${ROLE_CONSUMER_ENABLED}

  websocket:
    enabled: ${WEBSOCKET_ENABLED}

  redis:
    auth:
      host: ${REDIS_AUTH_HOST}
      port: ${REDIS_AUTH_PORT}
    service:
      host: ${REDIS_SERVICE_HOST}
      port: ${REDIS_SERVICE_PORT}

  rabbitmq:
    exchange: ai_exchange
    routing-key-summary: patient.summary
    summary-queue: patient_summary
    summary-reply-queue: summary_reply_queue
    routing-key-classification: patient.classification
    classification-queue: patient_classification

  refresh-token:
    store: ${REFRESH_TOKEN_STORE}
    cookie:
      name: refresh_token
      path: /api/v1/auth

openapi:
  nmc:
    api-key: ${OPEN_DATA_PORTAL_API_KEY}
    base-url: ${OPEN_DATA_PORTAL_BASE_URL}

websocket:
  relay:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_RELAY_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ai_server