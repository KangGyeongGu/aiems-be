server:
  shutdown: graceful
  tomcat:
    mbeanregistry:
      enabled: true

spring:
  application:
    name: transfer
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      repositories:
        enabled: false
  flyway:
    locations:
      - classpath:db/migration/{vendor}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ai_server
    publisher-confirm-type: correlated
    publisher-returns: true
  cloud:
    openfeign:
      client:
        config:
          hospitalRecommend:
            connect-timeout: 2000
            read-timeout: 3000

app:
  redis:
    service:
      host: ${REDIS_SERVICE_HOST}
      port: ${REDIS_SERVICE_PORT}
  minio:
    endpoint: ${MINIO_ENDPOINT}
    region: ${MINIO_REGION}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    voice-bucket: ${MINIO_VOICE_BUCKET}
    report-bucket: ${MINIO_REPORT_BUCKET}
    presign-ttl-minutes: ${MINIO_PRESIGN_TTL_MINUTES}
  services:
    hospital-url: ${HOSPITAL_SERVICE_URL}
    ambulance-url: ${AMBULANCE_SERVICE_URL}

resilience4j:
  circuitbreaker:
    instances:
      hospitalRecommend:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
  bulkhead:
    instances:
      hospitalRecommend:
        max-concurrent-calls: 20
        max-wait-duration: 100ms

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
