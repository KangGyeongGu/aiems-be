name: aiems-local

services:
  mysql:
    image: mysql:8.0.42
    container_name: aiems-database
    ports:
      - "127.0.0.1:3306:3306"
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: aiems
      MYSQL_USER: aiems
      MYSQL_PASSWORD: aiems
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./.data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u aiems -paiems --silent"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-auth:
    image: redis:7-alpine
    container_name: aiems-redis-auth
    ports:
      - "6379:6379"
    volumes:
      - ./.data/redis:/data

  redis-service:
    image: redis:7.2
    container_name: aiems-redis-service
    ports:
      - "6380:6379"
    restart: unless-stopped
    volumes:
      - ./.data/redis-service:/data

  rabbitmq:
    image: rabbitmq:4-management
    container_name: aiems-rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
      - "127.0.0.1:61613:61613"
      - "127.0.0.1:15692:15692"
    restart: unless-stopped
    volumes:
      - ./.data/rabbitmq:/var/lib/rabbitmq
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/load-defs.conf:/etc/rabbitmq/conf.d/20-load-defs.conf:ro

  minio:
    image: minio/minio:latest
    container_name: aiems-minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: aiems
      MINIO_ROOT_PASSWORD: aiems1234
    command: server /data --console-address ":9001"
    volumes:
      - ./.data/minio:/data

  minio-init:
    image: minio/mc:latest
    container_name: aiems-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 aiems aiems1234; do sleep 1; done;
      mc mb --ignore-existing local/aiems-voice;
      mc mb --ignore-existing local/aiems-report;
      "