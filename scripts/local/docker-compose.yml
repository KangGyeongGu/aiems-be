name: aiems-local

services:
  mysql:
    image: mysql:8.0.42
    container_name: aiems-database
    ports:
      - "127.0.0.1:3306:3306"
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: aiems
      MYSQL_USER: aiems
      MYSQL_PASSWORD: aiems
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./.data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u aiems -paiems --silent"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-auth:
    image: redis:7-alpine
    container_name: redis-auth
    ports:
      - "6379:6379"
    volumes:
      - ./.data/redis:/data