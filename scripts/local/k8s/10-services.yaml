# bed-ingestion (DB + rabbitmq, batch — replicas stays 1, no HPA)
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bed-ingestion
  namespace: aiems
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bed-ingestion
  template:
    metadata:
      labels:
        app: bed-ingestion
    spec:
      initContainers:
        - name: wait-for-infra
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306 && nc -z rabbitmq 5672; do echo waiting-for-infra; sleep 2; done"]
      containers:
        - name: bed-ingestion
          image: aiems-local-bed-ingestion:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: local
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=70"
            - name: DB_USERNAME
              value: aiems
            - name: DB_PASSWORD
              value: aiems
            - name: DB_URL
              value: "jdbc:mysql://mysql:3306/bed_ingestion_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_RELAY_PORT
              value: "61613"
            - name: RABBITMQ_USERNAME
              value: aiems
            - name: RABBITMQ_PASSWORD
              value: aiems
            - name: OPEN_DATA_PORTAL_API_KEY
              value: local-mock-key
            - name: OPEN_DATA_PORTAL_BASE_URL
              value: http://localhost:8080/mock
            - name: JWT_SECRET_KEY
              value: local-dev-secret-key-change-me-please-256-bit
            - name: JWT_ACCESS_EXPIRATION
              value: 1h
            - name: JWT_REFRESH_EXPIRATION
              value: 14d
            - name: CORS_ALLOWED_ORIGINS
              value: http://localhost:3000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command: ["sh", "-c", "pgrep -f app.jar > /dev/null"]
            initialDelaySeconds: 40
            periodSeconds: 15
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: bed-ingestion
