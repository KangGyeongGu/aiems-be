# All 9 MSA services. Images: aiems-local-<svc>:latest (loaded into minikube).
# Env mirrors scripts/local/docker-compose.msa.yml exactly.
# JAVA_TOOL_OPTIONS pins heap to container memory limit to avoid OOM.
# ---------------------------------------------------------------------------
# gateway
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: aiems
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
        - name: wait-for-infra
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306 && nc -z rabbitmq 5672; do echo waiting-for-infra; sleep 2; done"]
      containers:
        - name: gateway
          image: aiems-local-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=70"
            - name: SVC_AUTH_URL
              value: http://auth:8080
            - name: SVC_AMBULANCE_URL
              value: http://ambulance:8080
            - name: SVC_HOSPITAL_URL
              value: http://hospital:8080
            - name: SVC_TRANSFER_URL
              value: http://transfer:8080
            - name: SVC_NOTIFICATION_URL
              value: http://notification:8080
          resources:
            requests:
              cpu: 300m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: aiems
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
---
# ---------------------------------------------------------------------------
# auth (DB + redis-auth)
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: aiems
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      initContainers:
        - name: wait-for-infra
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306 && nc -z rabbitmq 5672; do echo waiting-for-infra; sleep 2; done"]
      containers:
        - name: auth
          image: aiems-local-auth:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=70"
            - name: DB_USERNAME
              value: aiems
            - name: DB_PASSWORD
              value: aiems
            - name: DB_URL
              value: "jdbc:mysql://mysql:3306/auth_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
            - name: REDIS_AUTH_HOST
