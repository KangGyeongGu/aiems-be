apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: aiems
data:
  enabled_plugins: |
    [rabbitmq_management,rabbitmq_stomp,rabbitmq_prometheus].
  rabbitmq.conf: |
    load_definitions = /etc/rabbitmq/definitions.json
  definitions.json: |
    {
      "users": [
        {
          "name": "aiems",
          "password_hash": "lYfNR7QGLDdnTiAY88yhbM1HopPg4Ht17et7XvcdTnbCgb7t",
          "hashing_algorithm": "rabbit_password_hashing_sha256",
          "tags": ["administrator"]
        }
      ],
      "vhosts": [
        { "name": "ai_server" }
      ],
      "permissions": [
        {
          "user": "aiems",
          "vhost": "ai_server",
          "configure": ".*",
          "write": ".*",
          "read": ".*"
        }
      ],
      "policies": [
        {
          "vhost": "ai_server",
          "name": "expire-stomp-user",
          "pattern": ".*-user",
          "apply-to": "queues",
          "priority": 0,
          "definition": { "expires": 60000 }
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: aiems
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4-management
          ports:
            - containerPort: 5672
            - containerPort: 61613
            - containerPort: 15672
            - containerPort: 15692
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 10
          volumeMounts:
            - name: config
              mountPath: /etc/rabbitmq/enabled_plugins
              subPath: enabled_plugins
            - name: config
              mountPath: /etc/rabbitmq/conf.d/20-load-defs.conf
              subPath: rabbitmq.conf
            - name: config
              mountPath: /etc/rabbitmq/definitions.json
              subPath: definitions.json
      volumes:
        - name: config
          configMap:
            name: rabbitmq-config
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: aiems
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: stomp
      port: 61613
      targetPort: 61613
    - name: management
      port: 15672
      targetPort: 15672
    - name: prometheus
      port: 15692
      targetPort: 15692
