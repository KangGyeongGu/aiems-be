name: aiems-app

# 다중 인스턴스 검증용 - was 2대(STOMP 릴레이 경유 상호 전달) + batch 1대(역할 분리 기동)
# 사전 조건: 인프라 compose(docker-compose.yml) 기동 후 실행
services:
  app-1:
    build:
      context: ../..
    image: aiems-be:local
    container_name: aiems-app-1
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      ROLE_BATCH_ENABLED: "false"
      ROLE_CONSUMER_ENABLED: "true"
      WEBSOCKET_ENABLED: "true"
    volumes:
      - ./app.env:/app/.env.local:ro
    networks:
      - aiems

  app-2:
    image: aiems-be:local
    container_name: aiems-app-2
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      ROLE_BATCH_ENABLED: "false"
      ROLE_CONSUMER_ENABLED: "true"
      WEBSOCKET_ENABLED: "true"
    volumes:
      - ./app.env:/app/.env.local:ro
    networks:
      - aiems

  batch-1:
    image: aiems-be:local
    container_name: aiems-batch-1
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      ROLE_BATCH_ENABLED: "true"
      ROLE_CONSUMER_ENABLED: "false"
      WEBSOCKET_ENABLED: "false"
    volumes:
      - ./app.env:/app/.env.local:ro
    networks:
      - aiems

networks:
  aiems:
    name: aiems-local_default
    external: true
